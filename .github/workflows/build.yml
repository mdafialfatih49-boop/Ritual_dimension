name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ritual-dimension-mod.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
      - run: gradle build
        working-directory: ritual-dimension-mod
      - uses: actions/upload-artifact@v4
        with:
          name: ritual-dimension-jar
          path: ritual-dimension-mod/build/libs/ritual-dimension-*[0-9].jar
